name: Deploy iBox TV test to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'iBox-source.zip'
      - '.github/workflows/deploy-pages.yml'
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack TV web app
        run: |
          unzip -q iBox-source.zip -d source
          test -f source/ibox-source/tv-web/index.html
          mkdir -p dist
          cp -R source/ibox-source/tv-web/. dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
